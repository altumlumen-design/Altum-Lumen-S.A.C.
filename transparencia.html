<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="index, follow">
  <meta name="description" content="Portal de Transparencia de ALTUM LUMEN S.A.C.: actos resolutivos, instrumentos de gestión y Mesa de Partes.">
  <title>Portal de Transparencia | ALTUM LUMEN S.A.C.</title>
  <style>
    :root{--ink:#14252e;--blue:#2c6f91;--blue-deep:#123f5a;--red:#b80e29;--line:#dbe6eb;--surface:#f7fafb}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--surface)}
    .loader{min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(180deg,#f7fbfd,#fff)}
    .loader-card{width:min(620px,100%);padding:34px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 20px 60px rgba(18,63,90,.12);text-align:center}
    .loader-card h1{margin:0;color:var(--blue-deep);font-size:clamp(1.7rem,4vw,2.4rem)}
    .loader-card p{margin:14px 0 0;color:#5c727d;line-height:1.65}
    .spinner{width:42px;height:42px;margin:24px auto 0;border:4px solid #dfeaf0;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
    .fallback{display:none;margin-top:24px;padding:18px;border:1px solid #ead5d9;border-radius:14px;background:#fff8f9;text-align:left}
    .fallback a{color:var(--red);font-weight:700}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="loader" id="loader">
    <section class="loader-card" aria-live="polite">
      <h1>Portal de Transparencia</h1>
      <p>Cargando información institucional actualizada...</p>
      <div class="spinner" aria-hidden="true"></div>
      <div class="fallback" id="fallback">
        <strong>No se pudo cargar temporalmente el portal completo.</strong>
        <p>La Resolución Directoral N.° 00005-2026-AL/DA puede consultarse directamente aquí:</p>
        <a href="documentos/actos-resolutivos/2026/direccion-academica/RDA-00005-2026-AL-DA.pdf" target="_blank" rel="noopener noreferrer">Ver Resolución Directoral N.° 00005-2026-AL/DA</a>
      </div>
    </section>
  </main>

  <script>
    (async () => {
      const BASE_SNAPSHOT = "https://raw.githubusercontent.com/altumlumen-design/Altum-Lumen-S.A.C./d51f30e8825c50fda19e273958398e73986bd2ab/transparencia.html";

      const newResolution = `              <article class="resolution-row" data-search="00005-2026-al-da dirección académica formaliza y aprueba el programa de alta especialización pae en gerencia de seguridad y criminología 384 horas académicas 24 créditos plan de estudios ficha académica efectos institucionales académicos 20 de febrero de 2026">
                <div class="resolution-id"><strong>Resolución Directoral N.° 00005-2026-AL/DA</strong><small>24 ago 2026 · Dirección Académica</small></div>
                <p class="resolution-summary">Formaliza y aprueba el Programa de Alta Especialización (PAE) en Gerencia de Seguridad y Criminología, con 384 horas académicas y 24 créditos; aprueba su Plan de Estudios y Ficha Académica, y reconoce efectos institucionales y académicos desde el 20 de febrero de 2026.</p>
                <a class="pdf-link" href="documentos/actos-resolutivos/2026/direccion-academica/RDA-00005-2026-AL-DA.pdf" target="_blank" rel="noopener noreferrer" aria-label="Ver PDF de Resolución Directoral N.° 00005-2026-AL/DA"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7V3Zm7 0v5h5M10 13h5M10 17h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
              </article>\n`;

      try {
        const response = await fetch(BASE_SNAPSHOT, {cache: "no-store"});
        if (!response.ok) throw new Error("No se pudo recuperar la versión base del portal");
        let html = await response.text();

        // Inserta la nueva resolución como la más reciente de Dirección Académica 2026.
        const marker = '<article class="resolution-row" data-search="00004-2026-al-da';
        const markerIndex = html.indexOf(marker);
        if (markerIndex === -1) throw new Error("No se encontró el punto de inserción de Dirección Académica");
        const articleStart = html.lastIndexOf('\n', markerIndex) + 1;
        html = html.slice(0, articleStart) + newResolution + html.slice(articleStart);

        // Corrige un listener duplicado de la versión base que invocaba una función inexistente.
        html = html.replace('    tabs.forEach(tab => tab.addEventListener("click", () => activateYear(tab.dataset.year)));\n', '');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.querySelector('.spinner').style.display = 'none';
        document.querySelector('#fallback').style.display = 'block';
        document.querySelector('.loader-card > p').textContent = 'No fue posible cargar el portal completo en este momento.';
      }
    })();
  </script>
</body>
</html>
