  <style>
    body{margin:0;font:16px system-ui,sans-serif;color:#182e3a;background:#f7fafb}
    main{min-height:95vh;display:flex;justify-content:center;align-items:center;padding:20px}
    .panel{max-width:650px;background:white;border:1px solid #dae3e8;
           border-radius:18px;padding:30px;box-shadow:0 16px 44px #15344813}
    h1{font-size:1.5rem;margin:0 0 14px} p{line-height:1.6}
    a{color:#176482;font-weight:600;display:block;margin-top:14px}
  </style>
</head>
<body>
<main><div class="panel">
<h1>Portal de Transparencia</h1>
<p id="msg">Cargando los actos resolutivos institucionales…</p>
<div id="fallback" hidden>
<a href="documentos/actos-resolutivos/2026/gerencia-general/RGG-00023-2026-AL-GG.pdf">Resolución N.° 00023-2026-AL/GG con anexo (PDF)</a>
<a href="documentos/actos-resolutivos/2026/gerencia-general/RGG-00022-2026-AL-GG.pdf">Resolución N.° 00022-2026-AL/GG con anexo (PDF)</a>
<a href="index.html">Volver al portal corporativo</a>
</div></div></main>
<script>
(async function() {
  const sourceURL = "https://raw.githubusercontent.com/altumlumen-design/Altum-Lumen-S.A.C./7145dd1f89a006d9c3004adf9c8e3a4451206712/transparencia.html";
  const gerenciaGeneral = "          <details class=\"unit\">\n            <summary>Gerencia General</summary>\n            <div class=\"resolution-list\">\n              <article class=\"resolution-row\" data-search=\"00023-2026-al-gg gerencia general reglamento general gestión procedimientos internos altum lumen sac 14 octubre 2026 001-2026 al-rg-001-2026\">\n                <div class=\"resolution-id\"><strong>Resolución de Gerencia General N.° 00023-2026-AL/GG</strong><small>14 oct 2026 · Gerencia General</small></div>\n                <p class=\"resolution-summary\">Aprueba el Reglamento General N.° 001-2026-AL/GG de Gestión y Procedimientos Internos de ALTUM LUMEN S.A.C., código AL-RG-001-2026, versión 1.1. Incluye el reglamento íntegro anexo y dispone su publicación institucional.</p>\n                <a class=\"pdf-link\" href=\"documentos/actos-resolutivos/2026/gerencia-general/RGG-00023-2026-AL-GG.pdf\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Ver PDF de Resolución de Gerencia General N.° 00023-2026-AL/GG con anexo\">Consultar resolución y anexo PDF ↗</a>\n              </article>\n              <article class=\"resolution-row\" data-search=\"00022-2026-al-gg gerencia general directiva lineamientos formulación revisión aprobación modificación actualización gestión directivas reglamentos planes instrumentos internos altum lumen 4 octubre 2026 al-di-001-2026\">\n                <div class=\"resolution-id\"><strong>Resolución de Gerencia General N.° 00022-2026-AL/GG</strong><small>04 oct 2026 · Gerencia General</small></div>\n                <p class=\"resolution-summary\">Aprueba la Directiva N.° 001-2026-AL/GG sobre formulación, revisión, aprobación, modificación, actualización y gestión de instrumentos internos, código AL-DI-001-2026, versión 1.0. Incluye la directiva íntegra anexa.</p>\n                <a class=\"pdf-link\" href=\"documentos/actos-resolutivos/2026/gerencia-general/RGG-00022-2026-AL-GG.pdf\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Ver PDF de Resolución de Gerencia General N.° 00022-2026-AL/GG con anexo\">Consultar resolución y anexo PDF ↗</a>\n              </article>\n            </div>\n          </details>\n";
  try {
    const response = await fetch(sourceURL, {cache:"force-cache"});
    if (!response.ok) throw Error("No se pudo cargar el portal base ("+response.status+")");
    let original = await response.text();
    const marker = "const administrationUnit = `";
    if (!original.includes(marker)) throw Error("No se encontró el punto de integración del registro de resoluciones.");
    original = original.replace(marker, marker + gerenciaGeneral);
    document.open(); document.write(original); document.close();
  } catch (error) {
    console.error("ALTUM LUMEN - Portal de Transparencia:", error);
    document.getElementById("msg").textContent =
      "No se pudo cargar el índice en este momento. Puede consultar las resoluciones directamente:";
    document.getElementById("fallback").hidden = false;
  }
})();
</script>
</body>
</html>
